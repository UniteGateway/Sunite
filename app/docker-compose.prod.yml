version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sunite-postgres-prod
    restart: always
    environment:
      POSTGRES_USER: sunite_admin
      POSTGRES_PASSWORD: SuniteProductionSecurePassword2026!
      POSTGRES_DB: sunite_production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunite_admin -d sunite_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sunite-redis-prod
    restart: always
    command: redis-server --requirepass SuniteRedisPassword2026!
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sunite-backend-prod
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://sunite_admin:SuniteProductionSecurePassword2026!@postgres:5432/sunite_production?schema=public
      REDIS_URL: redis://:SuniteRedisPassword2026!@redis:6379
      JWT_SECRET: SuniteProductionJwtSecretKey2026SuperSecure
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: sunite-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://api.sunite.io
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: sunite-nginx-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:

apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunite-backend-deployment
  namespace: sunite-production
  labels:
    app: sunite-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sunite-backend
  template:
    metadata:
      labels:
        app: sunite-backend
    spec:
      containers:
      - name: backend
        image: registry.sunite.io/sunite-backend:1.0.0
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: sunite-config
        - secretRef:
            name: sunite-secrets
        resources:
          limits:
            cpu: "1000m"
            memory: "2048Mi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 4000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sunite-backend-service
  namespace: sunite-production
spec:
  selector:
    app: sunite-backend
  ports:
  - protocol: TCP
    port: 4000
    targetPort: 4000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunite-frontend-deployment
  namespace: sunite-production
  labels:
    app: sunite-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sunite-frontend
  template:
    metadata:
      labels:
        app: sunite-frontend
    spec:
      containers:
      - name: frontend
        image: registry.sunite.io/sunite-frontend:1.0.0
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "200m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sunite-frontend-service
  namespace: sunite-production
spec:
  selector:
    app: sunite-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP

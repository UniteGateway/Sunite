apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sunite-production-ingress
  namespace: sunite-production
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
spec:
  tls:
  - hosts:
    - app.sunite.io
    - api.sunite.io
    secretName: sunite-tls-cert
  rules:
  - host: app.sunite.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sunite-frontend-service
            port:
              number: 3000
  - host: api.sunite.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sunite-backend-service
            port:
              number: 4000

apiVersion: v1
kind: Namespace
metadata:
  name: sunite-prod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sunite-config
  namespace: sunite-prod
data:
  NODE_ENV: "production"
  PORT: "3000"
  AWS_REGION: "ap-south-1"
---
apiVersion: v1
kind: Secret
metadata:
  name: sunite-secrets
  namespace: sunite-prod
type: Opaque
stringData:
  DATABASE_URL: "postgresql://sunite_user:SecurePass2026!@postgres-service:5432/sunite_db?schema=public&sslmode=require"
  REDIS_URL: "redis://:RedisPass2026!@redis-service:6379"
  JWT_SECRET: "sunite_enterprise_production_jwt_secret_key_2026_super_secure"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sunite-backend-deployment
  namespace: sunite-prod
  labels:
    app: sunite-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: sunite-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sunite-backend
    spec:
      containers:
        - name: sunite-backend
          image: sunite.azurecr.io/sunite-backend:v11.16.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: sunite-config
            - secretRef:
                name: sunite-secrets
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/v1/liveness
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/readiness
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: sunite-backend-service
  namespace: sunite-prod
spec:
  type: ClusterIP
  selector:
    app: sunite-backend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sunite-backend-hpa
  namespace: sunite-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sunite-backend-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sunite-ingress
  namespace: sunite-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/limit-rps: "100"
spec:
  tls:
    - hosts:
        - api.sunite.com
      secretName: sunite-tls-secret
  rules:
    - host: api.sunite.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sunite-backend-service
                port:
                  number: 80
